name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# สิทธิ์ที่ actions/deploy-pages ต้องใช้
permissions:
  contents: read
  pages: write
  id-token: write

# ถ้ามี push ซ้อนกันมา ให้ deploy เฉพาะตัวล่าสุด
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (base-href = /${{ github.event.repository.name }}/)
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      - name: Prepare artifact
        run: |
          # GitHub Pages ไม่รู้จัก route ฝั่ง client จึงต้องมี 404.html ที่เป็นสำเนา index.html
          cp dist/financetracker/browser/index.html dist/financetracker/browser/404.html
          # ปิด Jekyll เพื่อไม่ให้ไฟล์/โฟลเดอร์ที่ขึ้นต้นด้วย _ ถูกตัดทิ้ง
          touch dist/financetracker/browser/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/financetracker/browser

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
