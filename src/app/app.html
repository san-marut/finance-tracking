<div class="shell" [class.with-fab]="showFab()" [class.no-nav]="!showNav()">
  <header class="topbar">
    <div class="topbar-inner">
      @if (showBack()) {
        <button type="button" class="icon-btn soft" (click)="goBack()" aria-label="ย้อนกลับ">
          <app-icon name="back" [size]="22" />
        </button>
      } @else {
        <a routerLink="/dashboard" aria-label="กลับหน้าภาพรวม">
          <img class="brand-mark" src="icons/icon.svg" alt="" width="40" height="40" />
        </a>
      }

      <h1 class="heading">{{ heading() }}</h1>

      @if (installEvent()) {
        <button type="button" class="btn install-btn" (click)="install()">
          <app-icon name="install" [size]="16" />
          ติดตั้งแอป
        </button>
      }
    </div>
  </header>

  @if (updateReady()) {
    <div class="update-banner">
      <span>มีเวอร์ชันใหม่พร้อมใช้งาน</span>
      <button type="button" class="btn btn-primary" (click)="reloadApp()">อัปเดตเลย</button>
    </div>
  }

  <main class="content">
    <router-outlet />
  </main>

  @if (showFab()) {
    <a class="fab" routerLink="/entry" aria-label="เพิ่มรายการใหม่">
      <app-icon name="plus" [size]="28" [stroke]="2.6" />
    </a>
  }

  @if (showNav()) {
    <nav class="bottom-nav" aria-label="เมนูหลัก">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-item">
          <app-icon [name]="item.icon" [size]="22" />
          <span class="nav-label">{{ item.label }}</span>
          <span class="nav-dot" aria-hidden="true"></span>
        </a>
      }
    </nav>
  }
</div>
