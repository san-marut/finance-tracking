<section class="controls">
  <div class="segmented block" role="tablist" aria-label="ช่วงเวลาที่ดู">
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="mode() === 'month'"
      [class.on]="mode() === 'month'"
      (click)="setMode('month')"
    >
      รายเดือน
    </button>
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="mode() === 'day'"
      [class.on]="mode() === 'day'"
      (click)="setMode('day')"
    >
      รายวัน
    </button>
  </div>

  @if (mode() === 'month') {
    <app-month-picker [month]="store.selectedMonth()" (monthChange)="setMonth($event)" />
  } @else {
    <app-day-picker [date]="store.selectedDate()" (dateChange)="setDate($event)" />
  }
</section>

<section class="card filters">
  <div class="search-box">
    <app-icon name="search" [size]="18" />
    <input
      class="input"
      type="search"
      placeholder="ค้นหาบันทึก แท็ก หรือจำนวนเงิน"
      [(ngModel)]="query"
    />
  </div>

  <div class="segmented block">
    <button type="button" [class.on]="kindFilter() === 'all'" (click)="setKind('all')">ทั้งหมด</button>
    <button type="button" [class.on]="kindFilter() === 'expense'" (click)="setKind('expense')">
      รายจ่าย
    </button>
    <button type="button" [class.on]="kindFilter() === 'income'" (click)="setKind('income')">
      รายรับ
    </button>
  </div>

  <select class="select" [(ngModel)]="categoryFilter" aria-label="กรองตามแท็กหลัก">
    <option value="">ทุกแท็กหลัก</option>
    @for (c of categoryOptions(); track c.id) {
      <option [value]="c.id">{{ c.icon }} {{ c.name }}</option>
    }
  </select>
</section>

<section class="card totals">
  <div class="stat-row">
    <span class="stat">
      <span class="stat-label">รายรับ</span>
      <span class="stat-value display amount-pos">{{ total().income | money: 0 }}</span>
    </span>
    <span class="stat">
      <span class="stat-label">รายจ่าย</span>
      <span class="stat-value display amount-neg">{{ total().expense | money: 0 }}</span>
    </span>
    <span class="stat">
      <span class="stat-label">สุทธิ</span>
      <span class="stat-value display" [class.amount-neg]="total().balance < 0">
        {{ total().balance | money: 0 }}
      </span>
    </span>
  </div>
</section>

<section class="section">
  <div class="section-title">
    <span>{{ periodLabel() }} <span class="hint">{{ total().count }} รายการ</span></span>
    @if (hasFilter()) {
      <button type="button" class="link clear-btn" (click)="clearFilters()">
        <app-icon name="close" [size]="16" /> ล้างตัวกรอง
      </button>
    }
  </div>

  <app-tx-list
    [transactions]="filtered()"
    [emptyText]="emptyText()"
    [showDayHeader]="mode() === 'month'"
  />
</section>
