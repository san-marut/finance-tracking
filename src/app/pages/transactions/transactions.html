<div class="head">
  <div class="mode-switch" role="tablist" aria-label="ช่วงเวลาที่ดู">
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="mode() === 'month'"
      [class.on]="mode() === 'month'"
      (click)="setMode('month')"
    >
      รายเดือน
    </button>
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="mode() === 'day'"
      [class.on]="mode() === 'day'"
      (click)="setMode('day')"
    >
      รายวัน
    </button>
  </div>

  @if (mode() === 'month') {
    <app-month-picker
      [month]="store.selectedMonth()"
      (monthChange)="setMonth($event)"
      (jumpToNow)="resetMonth()"
    />
  } @else {
    <app-day-picker [date]="store.selectedDate()" (dateChange)="setDate($event)" />
  }
</div>

<div class="card filters">
  <input
    class="input search"
    type="search"
    placeholder="ค้นหาบันทึก / แท็ก / จำนวนเงิน"
    [(ngModel)]="query"
  />

  <div class="chip-row">
    <button type="button" class="fchip" [class.on]="kindFilter() === 'all'" (click)="setKind('all')">
      ทั้งหมด
    </button>
    <button
      type="button"
      class="fchip expense"
      [class.on]="kindFilter() === 'expense'"
      (click)="setKind('expense')"
    >
      รายจ่าย
    </button>
    <button
      type="button"
      class="fchip income"
      [class.on]="kindFilter() === 'income'"
      (click)="setKind('income')"
    >
      รายรับ
    </button>
  </div>

  <select class="select" [(ngModel)]="categoryFilter">
    <option value="">ทุกแท็กระดับ 1</option>
    @for (c of categoryOptions(); track c.id) {
      <option [value]="c.id">{{ c.icon }} {{ c.name }}</option>
    }
  </select>

  @if (hasFilter()) {
    <button type="button" class="btn btn-ghost clear-btn" (click)="clearFilters()">
      ล้างตัวกรอง ✕
    </button>
  }
</div>

<div class="totals card">
  <div>
    <small>รายรับ</small>
    <b class="tabular amount-pos">{{ total().income | money: 0 }}</b>
  </div>
  <div>
    <small>รายจ่าย</small>
    <b class="tabular amount-neg">{{ total().expense | money: 0 }}</b>
  </div>
  <div>
    <small>สุทธิ</small>
    <b
      class="tabular"
      [class.amount-pos]="total().balance >= 0"
      [class.amount-neg]="total().balance < 0"
    >
      {{ total().balance | money: 0 }}
    </b>
  </div>
  <div>
    <small>จำนวน</small>
    <b class="tabular">{{ total().count }}</b>
  </div>
</div>

<app-tx-list
  [transactions]="filtered()"
  [emptyText]="emptyText()"
  [showDayHeader]="mode() === 'month'"
/>
